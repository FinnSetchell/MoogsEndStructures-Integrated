# Build inputs only. Everything the publish pipeline needs (project ids, MC windows,
# display names, Discord styling, dependencies) lives in .github/moogs-publish.yml on the
# repository's default branch. Keys are snake_case fleet-wide.
org.gradle.jvmargs=-Xmx2G

# Project
mod_id=mesintegrated
mod_name=MoogsEndStructuresIntegrated
mod_version=4.7.0
mod_description=Biomes O' Plenty versions of the deepslate mega ships from Moog's End Structures

# Minecraft (the oldest version this build supports; it covers 1.20 through 26.3)
minecraft_version=1.20

# Metadata links expanded into fabric.mod.json / quilt.mod.json / mods.toml / pack.mcmeta
mod_homepage=https://modrinth.com/datapack/mes-biomes-o-plenty-compat-pack
mod_sources=https://github.com/FinnSetchell/MoogsEndStructures-Integrated
mod_releases=https://github.com/FinnSetchell/MoogsEndStructures-Integrated/releases
mod_issues=https://github.com/FinnSetchell/MoogsEndStructures-Integrated/issues
mod_discord=https://discord.gg/S5nffJbuvA
mod_kofi=https://ko-fi.com/finndog
mod_curseforge=https://www.curseforge.com/minecraft/mc-mods/mes-biomes-o-plenty-compat-pack
mod_modrinth=https://modrinth.com/datapack/mes-biomes-o-plenty-compat-pack

# Dependency ranges (forge/neoforge mods.toml). The ships use MES 2.1's crew pools.
structure_lib_version_range=[1.1.0,)
mes_version_range=[2.1.0,)
