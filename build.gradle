plugins {
    id 'java'
}

group = "com.finndog"

java {
    withSourcesJar()
}

// gradle.properties is snake_case fleet-wide (release-actions docs/v2-contracts.md,
// "Fleet conventions"). Publishing configuration lives in .github/moogs-publish.yml on
// the default branch — Gradle's only job here is `./gradlew build` + `buildDatapack`.
def modName = (project.findProperty('mod_name') ?: project.name) as String
def mcVersion = project.findProperty('minecraft_version') as String
def modId = project.findProperty('mod_id') as String
version = project.findProperty('mod_version') as String

repositories {
    mavenCentral()
}

tasks.processResources {
    def meta = [
            'version': version,
            'mod_name': modName,
            'mc_version': mcVersion,
            'mod_id': modId,
            'mod_description': project.findProperty('mod_description'),
            'mod_homepage': project.findProperty('mod_homepage'),
            'mod_sources': project.findProperty('mod_sources'),
            'mod_issues': project.findProperty('mod_issues'),
            'mod_discord': project.findProperty('mod_discord'),
            'mod_kofi': project.findProperty('mod_kofi'),
            'mod_curseforge': project.findProperty('mod_curseforge'),
            'mod_modrinth': project.findProperty('mod_modrinth'),
            'mod_releases': project.findProperty('mod_releases'),
            'structure_lib_version_range': project.findProperty('structure_lib_version_range'),
            'mes_version_range': project.findProperty('mes_version_range'),
    ]
    // Version and the other metadata values are expand() inputs, not file inputs, so
    // Gradle cannot see them change. Without this, bumping mod_version leaves the
    // previously expanded fabric.mod.json / mods.toml in place and the jar ships the
    // OLD version string under a NEW file name.
    inputs.properties(meta)
    filesMatching('fabric.mod.json') { expand(meta) }
    filesMatching('quilt.mod.json') { expand(meta) }
    filesMatching('META-INF/*.toml') { expand(meta) }
    filesMatching('pack.mcmeta') { expand(meta) }
}

// Fleet-standard artifact filename: {ModName}-{loader}-{mc}-{version}. A universal jar has
// no single loader, so `universal` fills the loader slot. Setting archivesName rather than
// jar.archiveFileName keeps the sources jar on the same stem.
base {
    archivesName = "${modName}-universal-${mcVersion}"
}

// The datapack is what CurseForge and Modrinth get; the jar goes to GitHub releases only.
// Both carry the same data. `datapack` fills the loader slot because it is the real
// Modrinth loader tag the pack publishes under.
def datapackArchiveName = "${modName}-datapack-${mcVersion}-${project.version}.zip"

tasks.register('buildDatapack', Zip) {
    group = 'build'
    description = 'Assembles the datapack zip from the processed mod resources.'
    dependsOn tasks.named('processResources')

    def resourcesDir = sourceSets.main.output.resourcesDir
    archiveFileName.set(datapackArchiveName)
    destinationDirectory.set(layout.buildDirectory.dir('datapack'))

    from(resourcesDir) {
        include 'pack.mcmeta'
        include 'data/**'
    }
    // The mod's icon becomes the datapack's pack.png at the zip root.
    from(resourcesDir) {
        include "assets/${modId}/icon.png"
        includeEmptyDirs = false
        eachFile { it.path = 'pack.png' }
    }
}
